# Paycheck Planner (Stage 1) storefront values. The ONE place for the Stripe Payment Links
# and the MailerLite form ids. tests/check_paycheck_planner.py --launch fails if a value still ends in _TODO
# or if a Payment Link is not a https://buy.stripe.com/ URL.
#
# Delivery is Stripe's hosted confirmation screen only. Email ruel@getcyberdadkit.com is the re-send backup.
# Do not put paid file links in this file or on any page.
stripe_url_planner: "https://buy.stripe.com/bJe28qaCyfyMeP33jVds40j"
stripe_url_bundle: "https://buy.stripe.com/aFacN42620DS5et8Efds40k"
#
# Free mini sheet signup: existing MailerLite account 1632878, embedded form from Support (M-S61): id 205066869153990151,
# slug IW0v9B, adds to group planner-sample 205065952004408885 only, double opt-in ON. Nothing is created or edited in MailerLite from this repo.
# mailerlite_form_slug is the data-form value; mailerlite_form_id is the numeric id (the MailerLite success callback
# ml_webform_success_<id> fires sign_up). The form renders empty until Support finishes its fields in MailerLite.
mailerlite_form_slug: "IW0v9B"
mailerlite_form_id: "205066869153990151"
# Optional sales and bundle signup include uses this same official IW0v9B embed (reCAPTCHA included).

