# Visible Buy-button copy on the pages is unchanged in this patch and still states the same amounts.
# Do not add Stripe URLs here beyond the two Payment Links above.
price_planner: "14.99"
price_planner_regular: "19.99"
price_planner_regular_from: "2027-01-01"
price_bundle: "39.00"
