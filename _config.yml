# Jekyll Configuration for CyberDadKit
# G2 (Growth): one value per key. Duplicate title/description/author/plugins keys removed (YAML keeps only the last one, which silently overrode the first block).
title: "CyberDadKit"
description: "Plain-English family online safety from CyberDadKit: home Wi-Fi, kids' devices, passwords and scams, with a free family tech safety checklist."
author:
  name: "Ruel Miller"
  email: "ruel@getcyberdadkit.com"
email: "ruel@getcyberdadkit.com"
url: "https://cyberdad2025.github.io"
baseurl: ""

# Build settings
markdown: kramdown
highlighter: rouge
permalink: /:year/:month/:day/:title.html

# CRITICAL FIX - Allow future posts and set timezone
future: true
timezone: America/New_York

# GA4 (G-5B1LNCPB56) is loaded once by _layouts/default.html; no google_analytics key (it held a placeholder).

# Theme
remote_theme: jekyll/minima

# Social links
twitter_username: cyberdad2025
github_username: CyberDad2025

# Collections
collections:
  posts:
    output: true
    permalink: /:year/:month/:day/:title.html

# Default layout for posts
defaults:
  # M-P21: every post (_posts/ and scripts/_posts/) is noindex (plain <meta name="robots" content="noindex">, links still
  # followed; printed by _layouts/default.html) and left out of sitemap.xml (jekyll-sitemap skips sitemap: false), EXCEPT the
  # 8 keep-list posts below (Growth M-G20 keep-list: 3 canonicals + 5 Tier A). Reversible: delete these keys. No files deleted.
  - scope:
      path: ""
      type: "posts"
    values:
      layout: "post"
      author: "CyberDad2025"
      noindex: true
      sitemap: false
  - scope:
      path: "_posts/2025-07-30-simple-password-safety.md"
      type: "posts"
    values:
      noindex: false
      sitemap: true
  - scope:
      path: "_posts/2025-08-10-easy-wifi-protection.md"
      type: "posts"
    values:
      noindex: false
      sitemap: true
  - scope:
      path: "_posts/2025-08-12-avoid-bad-emails.md"
      type: "posts"
    values:
      noindex: false
      sitemap: true
  - scope:
      path: "_posts/2025-07-23-home-router-security-in-5-minutes.md"
      type: "posts"
    values:
      noindex: false
      sitemap: true
  - scope:
      path: "_posts/2025-07-23-family-data-backup-strategy.md"
      type: "posts"
    values:
      noindex: false
      sitemap: true
  - scope:
      path: "_posts/2026-04-28-your-kids-gaming-account-is-a-target-heres-how-to-lock-it-do.md"
      type: "posts"
    values:
      noindex: false
      sitemap: true
  - scope:
      path: "_posts/2026-04-29-nsa-grassmarlin-a-hidden-risk-for-your-family.md"
      type: "posts"
    values:
      noindex: false
      sitemap: true
  - scope:
      path: "scripts/_posts/2025-07-28-daily-cybersecurity-update.md"
      type: "posts"
    values:
      noindex: false
      sitemap: true
  # M-P21: thin/legacy pages kept out of the sitemap (not deleted). logs/sync-report also gets noindex + no_ads.
  # cyber_*.html are plain HTML (no front matter), so their noindex meta is written in the files themselves.
  - scope:
      path: "logs/sync-report.md"
    values:
      noindex: true
      no_ads: true
      sitemap: false
  - scope:
      path: "cyberdadkit-privacy-policy-cyberdadkit.html"
    values:
      sitemap: false
  - scope:
      path: "cyber_2025-07-15_1752577965.html"
    values:
      sitemap: false
  - scope:
      path: "cyber_2025-07-15_1752580178.html"
    values:
      sitemap: false
  - scope:
      path: "cyber_parenting_global_blog.html"
    values:
      sitemap: false
  - scope:
      path: ""
    values:
      layout: "default"

# Pagination
paginate: 25
paginate_path: "/page:num/"

# SEO
lang: en
google_site_verification: # Add your verification code here later

# Navigation
header_pages:
  - about.md
  - contact.md

# Exclude files
exclude:
  - README.md
  - Gemfile
  - Gemfile.lock
  - node_modules
  - vendor
  - .sass-cache
  - .jekyll-cache
  - .github

# Include files
include:
  - _pages

# Sass
sass:
  style: compressed

# Security
safe: true

# Plugins: one list = the set GitHub Pages actually runs for this site (github-pages 232: its default plugins, plus
# jekyll-remote-theme because remote_theme is set, plus feed/sitemap/seo-tag). whitelist repeats it so a local build
# with only this file works under safe: true (GitHub Pages ignores this whitelist and applies its own, which has all of these).
plugins:
  - jekyll-feed
  - jekyll-sitemap
  - jekyll-seo-tag
  - jekyll-paginate
  - jekyll-remote-theme
  - jekyll-github-metadata
  - jekyll-relative-links
  - jekyll-optional-front-matter
  - jekyll-readme-index
  - jekyll-default-layout
  - jekyll-titles-from-headings
whitelist:
  - jekyll-feed
  - jekyll-sitemap
  - jekyll-seo-tag
  - jekyll-paginate
  - jekyll-remote-theme
  - jekyll-github-metadata
  - jekyll-relative-links
  - jekyll-optional-front-matter
  - jekyll-readme-index
  - jekyll-default-layout
  - jekyll-titles-from-headings
